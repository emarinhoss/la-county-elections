name: fetch

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

# One run at a time so two runs never push at once.
concurrency:
  group: fetch
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run tests
        run: |
          python -m pip install pytest
          python -m pytest -q
      - name: Fetch sources
        run: python -m collect.fetch config/sources.json data/raw
      - name: Parse snapshots into tidy tables
        run: python -m parse.election 2026-11-03-general
      - name: Commit new snapshots
        run: |
          git config user.name "election-collector"
          git config user.email "actions@users.noreply.github.com"
          git add data/raw data/tidy
          if git diff --cached --quiet; then
            echo "nothing new"
          else
            git commit -m "data: new raw snapshots $(date -u +%Y-%m-%dT%H:%MZ)"
            git pull --rebase
            git push
          fi

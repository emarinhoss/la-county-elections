name: fetch

# One collection cycle (tools/fetch_cycle.sh), twice an hour, at off-peak minutes (GitHub delays or drops scheduled runs that
# start at :00, :15, :30 and :45). This is the BACKSTOP for poll.yml, which collects every few minutes. A failing test or a
# failing parse must never stop collection, so tests live in ci.yml and every step after the fetch may fail on its own.

on:
  schedule:
    - cron: "7,37 * * * *"
  workflow_dispatch:
    inputs:
      test_dispatch:
        description: "Self-test: also start svc-rehearsal for the published 2024 file, to prove this workflow can start it"
        type: boolean
        default: false

# One at a time, so two runs never fetch and push at once.
concurrency:
  group: fetch
  cancel-in-progress: false

permissions:
  contents: write
  actions: write   # to start pages.yml and svc-rehearsal.yml

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: One collection cycle
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash tools/fetch_cycle.sh
      - name: Self-test of the dispatch (manual runs with test_dispatch ticked only)
        if: inputs.test_dispatch == true
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run svc-rehearsal.yml --ref main -f url="https://content.lavote.gov/docs/rrcc/svc/4324_final_svc_precinct_public.pdf"

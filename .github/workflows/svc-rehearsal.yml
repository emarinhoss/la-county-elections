name: svc-rehearsal

# Manual. Runs the whole precinct-to-city pipeline on one county SVC precinct PDF (default: the 2024 general election,
# a dress rehearsal for 2026). The PDF and the full precinct table stay on the runner. Only small result files are committed:
#   data/reference/precinct_layer.csv        (the county precinct layer's id -> city code table, about 1-2 MB)
#   data/rehearsal/<pdf name>/                (checks, city-code names, countywide totals by city, a summary)
on:
  workflow_dispatch:
    inputs:
      url:
        description: "County SVC precinct PDF (must start with https://content.lavote.gov/docs/rrcc/svc/)"
        required: true
        default: "https://content.lavote.gov/docs/rrcc/svc/4324_final_svc_precinct_public.pdf"

# Same group as fetch, so the two never push to main at once.
concurrency:
  group: fetch
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  rehearsal:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      SVC_URL: ${{ inputs.url }}   # passed as an env var, never pasted into shell code
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Check the URL
        run: python -c "import os; from tools.svc_sample import check_url; check_url(os.environ['SVC_URL'])"
      - name: Install poppler
        run: sudo apt-get update -qq && sudo apt-get install -y -qq poppler-utils
      - name: Download the precinct layer attributes (paged, checked against the layer's own count)
        run: |
          mkdir -p data/reference
          python -m tools.arcgis_attrs data/reference/precinct_layer.csv
      - name: Download the PDF (kept on the runner only)
        run: |
          curl -fL --retry 3 --max-filesize 300000000 -A "la-county-elections-collector (public research project)" \
            -o "$RUNNER_TEMP/svc.pdf" "$SVC_URL"
          ls -l "$RUNNER_TEMP/svc.pdf"
      - name: Run the pipeline
        run: |
          name="$(basename "$SVC_URL" .pdf)"
          boundary="$(ls data/raw/*/city_boundary_geojson/*/body | sort | tail -1)"
          echo "boundary file: $boundary"
          python -m tools.svc_pipeline "$RUNNER_TEMP/svc.pdf" data/reference/precinct_layer.csv "$boundary" "data/rehearsal/$name"
          cat "data/rehearsal/$name/summary.md" >> "$GITHUB_STEP_SUMMARY"
          test "$(du -sk data/rehearsal/$name data/reference | awk '{s+=$1} END {print s}')" -lt 20000   # stop above about 20 MB
      - name: Commit the results
        run: |
          git config user.name "election-collector"
          git config user.email "actions@users.noreply.github.com"
          git add data/reference data/rehearsal
          if git diff --cached --quiet; then
            echo "nothing new"
          else
            git commit -m "data: SVC rehearsal $(basename "$SVC_URL" .pdf)"
            git pull --rebase
            git push
          fi

name: svc-sample

# One-off, manual. Downloads one county Statement of Votes Cast PDF onto the runner, extracts the text of a
# few sample pages, and commits only those pages plus metadata (never the PDF itself, which can be 60+ MB).
on:
  workflow_dispatch:
    inputs:
      url:
        description: "County SVC PDF (must start with https://content.lavote.gov/docs/rrcc/svc/)"
        required: true
        default: "https://content.lavote.gov/docs/rrcc/svc/4324_final_svc_precinct_public.pdf"

# Own group (not fetch's): a shared group keeps only one pending run, so a later fetch run could cancel this one.
# Pushes to main are made safe by the rebase-and-retry loop below instead.
concurrency:
  group: svc
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  sample:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      SVC_URL: ${{ inputs.url }}   # passed as an env var, never pasted into shell code
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Check the URL
        run: python -c "import os; from tools.svc_sample import check_url; check_url(os.environ['SVC_URL'])"
      - name: Install poppler
        run: sudo apt-get update -qq && sudo apt-get install -y -qq poppler-utils
      - name: Download the PDF (kept on the runner only)
        run: |
          curl -fL --retry 3 --max-filesize 300000000 -A "la-county-elections-collector (public research project)" \
            -o "$RUNNER_TEMP/svc.pdf" "$SVC_URL"
          ls -l "$RUNNER_TEMP/svc.pdf"
      - name: Extract the sample
        run: |
          name="$(basename "$SVC_URL" .pdf)"
          python -m tools.svc_sample "$RUNNER_TEMP/svc.pdf" "data/samples/svc/$name" "$SVC_URL"
          du -sh "data/samples/svc/$name"
          test "$(du -sk "data/samples/svc/$name" | cut -f1)" -lt 5000   # stop if the sample is over about 5 MB
      - name: Commit the sample
        run: |
          git config user.name "election-collector"
          git config user.email "actions@users.noreply.github.com"
          git add data/samples
          if git diff --cached --quiet; then
            echo "nothing new"
          else
            git commit -m "data: SVC PDF sample $(basename "$SVC_URL" .pdf)"
            for i in 1 2 3 4; do git pull --rebase && git push && break; sleep $((i * 5)); done
          fi

<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>LA County Election Results</title>
<meta name="description" content="Unofficial results for the Los Angeles County general election: key races, a city-by-city map, and every contest on the ballot.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='9' fill='%232a78d6'/%3E%3Cpath d='M9 17l4.5 4.5L23 11' fill='none' stroke='white' stroke-width='3' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
<link rel="preload" href="vendor/inter/inter-latin-wght-normal.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="vendor/leaflet/leaflet.css">
<link rel="stylesheet" href="style.css">
<script>
  // Apply a saved theme before the page paints, so a dark-mode reader does not see a white flash.
  try { var t = localStorage.getItem("theme"); if (t === "light" || t === "dark") document.documentElement.dataset.theme = t; } catch (e) {}
</script>
</head>
<body>
<a class="skip" href="#app">Skip to results</a>
<header class="topbar">
  <div class="topbar-in">
    <a class="brand" href="#/overview" aria-label="LA County election results, home">
      <span class="brand-mark" aria-hidden="true"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M5 13l4.5 4.5L19 7"/></svg></span>
      <span class="brand-name">LA County Election Results<span class="brand-sub" id="brand-sub">General Election</span></span>
    </a>
    <nav class="nav" aria-label="Sections">
      <a href="#/overview" data-nav="overview">Overview</a>
      <a href="#/map" data-nav="map">Map</a>
      <a href="#/contests" data-nav="contests">All contests</a>
    </nav>
    <div class="top-actions">
      <span class="status-chip" id="status-chip" role="status"><span class="dot" aria-hidden="true"></span><span id="status-text">Loading…</span></span>
      <button class="icon-btn" id="about-btn" type="button" aria-label="About these numbers" title="About these numbers">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M12 11v5M12 8h.01"/></svg>
      </button>
      <button class="icon-btn" id="theme-btn" type="button" aria-label="Switch between light and dark" title="Light / dark">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.8A9 9 0 1111.2 3a7 7 0 009.8 9.8z"/></svg>
      </button>
    </div>
  </div>
</header>

<main class="page" id="app" tabindex="-1">
  <section class="view" id="view-overview" aria-label="Overview"></section>
  <section class="view" id="view-map" aria-label="Results map" hidden></section>
  <section class="view" id="view-contests" aria-label="All contests" hidden></section>
</main>

<footer class="site">
  Unofficial results from the LA County Registrar-Recorder/County Clerk, collected by
  <a href="https://github.com/emarinhoss/la-county-elections">this open project</a>. Counts change until the county certifies the election.
</footer>

<dialog id="about" aria-labelledby="about-title">
  <div class="dialog-head"><h2 id="about-title" style="font-size:18px;font-weight:680;letter-spacing:-.01em">About these numbers</h2>
    <button class="icon-btn" type="button" id="about-close" aria-label="Close"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg></button></div>
  <div class="dialog-body" id="about-body"></div>
</dialog>

<script src="vendor/leaflet/leaflet.js"></script>
<script type="module" src="js/app.js"></script>
</body>
</html>
